[display]
pin_images = false
compact_notifications = true
show_agentgrep_output = true
show_bash_output = true
tool_call_details = true
session_picker_default_filter = "current-dir"
session_picker_sort = "created"

[features]
memory = false
swarm = true

[tools]
mcp_tools = "deferred"
disabled = [
  "swarm",
  "maintainer_feedback"
]

[websearch]
engine = "searxng"
searxng_url = "https://search.internal.4jd.io"

[provider]
default_model = "openai/gpt-6-luna"
default_provider = "openrouter-eu"
allowed_providers = ["openrouter-eu"]
openai_service_tier = "flex"
same_provider_account_failover = false
retry_backoff_cap_secs = 300

[agents]
swarm_model = "openrouter-eu:gpt-6-luna"
swarm_root_effort = "max"
swarm_deep_root_effort = "max"
swarm_effort = "none"
memory_model = "openrouter-eu:gpt-6-luna"

[agents.worker_blueprints.fixer]
effort = "none"

[agents.worker_blueprints.investigator]
effort = "none"

[agents.worker_blueprints.research]
effort = "none"

[hooks]
pre_tool_transform = ["~/.jcode/plugins/rtk-transform"]

[ambient]
model = "openrouter-eu:gpt-6-luna"

[compaction]
mode = "proactive"

[autoreview]
model = "openrouter-eu:gpt-6-sol"

[autojudge]
model = "openrouter-eu:gpt-6-luna"

[launch_hotkeys]
enabled = false
imported = true
